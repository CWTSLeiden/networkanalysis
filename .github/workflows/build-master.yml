# This workflow will build a package using Gradle.
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Build master branch

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '8'
    - name: Print version
      run: ./gradlew --no-daemon printVersion
    - name: Build with Gradle
      run: ./gradlew --no-daemon build
    - name: Generate sources jar with Gradle
      run: ./gradlew --no-daemon sourcesJar
    - name: Generate JavaDoc jar with Gradle
      run: ./gradlew --no-daemon javadocJar
    - name: Upload package as artifact
      uses: actions/upload-artifact@v7
      with:
        name: Package
        path: build/libs
